name: MoniMac
options:
  bundleIdPrefix: io.github.lethanhvietctt5
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
packages:
  MoniMacKit:
    path: MoniMacKit
  # The in-app updater (ticket 20). Pinned so release builds don't float to a new Sparkle on the runner.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Only scripts/release/build.sh turns this on. Development builds never start Sparkle, so they don't
    # contact the feed or ask about automatic checks.
    MONIMAC_UPDATES: "NO"
schemes:
  MoniMac:
    build:
      targets:
        MoniMac: all
        MoniMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoniMacUITests
      # Automatic screen capture records the whole screen, including the user's other apps, so it's off.
      # (Without it XCUIElement.screenshot() fails as well, so the UI tests take no screenshots.)
      captureScreenshotsAutomatically: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  MoniMac:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Assets.xcassets
    dependencies:
      - package: MoniMacKit
        product: MoniMacCore
      - package: MoniMacKit
        product: MoniMacSystem
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MoniMac
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        # Showing the Wi-Fi network name requires Location access (ticket 07).
        NSLocationUsageDescription: MoniMac shows the name of the Wi-Fi network you're connected to.
        NSLocationWhenInUseUsageDescription: MoniMac shows the name of the Wi-Fi network you're connected to.
        # Per-app volume (ticket 17) routes an app's audio through a Core Audio process tap, which needs the
        # System Audio Recording permission. macOS asks the first time a tap starts, never at launch.
        NSAudioCaptureUsageDescription: MoniMac changes an app's volume by routing its audio through MoniMac. Nothing is recorded or saved.
        # Updates (ticket 20). The feed is the appcast attached to the newest GitHub release.
        MoniMacUpdatesEnabled: $(MONIMAC_UPDATES)
        SUFeedURL: https://github.com/lethanhvietctt5/moni-mac/releases/latest/download/appcast.xml
        # The project's EdDSA public key. scripts/release/setup-wizard.sh replaces the placeholder;
        # scripts/release/check-update-key.sh fails the release while it's still here.
        SUPublicEDKey: sF60e+ebb6hCMp1/M5/xE3pzOaFve+rGs/ew1W8hcnU=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lethanhvietctt5.MoniMac
        PRODUCT_NAME: MoniMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  # UI tests (XCUITest) that click the real app. See "UI tests" in CLAUDE.md.
  MoniMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests/MoniMacUITests
    dependencies:
      - target: MoniMac
      # Built next to the runner; the quit tests quit this app, never one of the user's.
      - target: MoniMacUITestDummy
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lethanhvietctt5.MoniMacUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: UITests/MoniMacUITests/MoniMacUITests.entitlements
        TEST_TARGET_NAME: MoniMac
  # A throwaway regular app for the UI tests to quit through MoniMac's quit sheet.
  MoniMacUITestDummy:
    type: application
    platform: macOS
    sources:
      - UITests/Dummy
    info:
      path: UITests/Dummy/Info.plist
      properties:
        CFBundleDisplayName: MoniMacUITestDummy
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lethanhvietctt5.MoniMacUITestDummy
        PRODUCT_NAME: MoniMacUITestDummy
        GENERATE_INFOPLIST_FILE: NO
