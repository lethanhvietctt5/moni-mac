<!doctype html>
<!--
  Source for public/og.png (1200 × 630). Not part of the site build.
  Regenerate with `npm run og` (needs Google Chrome), then commit public/og.png.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MoniMac Open Graph image</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #f5f5f7;
        background:
          radial-gradient(600px 420px at 18% 8%, rgba(46, 155, 255, 0.42), transparent 70%),
          radial-gradient(520px 420px at 92% 85%, rgba(94, 92, 230, 0.32), transparent 70%),
          radial-gradient(420px 300px at 70% 10%, rgba(94, 225, 255, 0.16), transparent 70%),
          #07080c;
        display: flex;
        padding: 72px 72px 64px;
        gap: 56px;
      }
      .copy { flex: 1; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
      .brand img { width: 64px; height: 64px; filter: drop-shadow(0 10px 30px rgba(30, 110, 255, 0.55)); }
      h1 { margin-top: 56px; font-size: 66px; line-height: 1.04; font-weight: 700; letter-spacing: -0.03em; }
      h1 span { background: linear-gradient(90deg, #5ee1ff, #3d9bff 55%, #6f7bff); -webkit-background-clip: text; color: transparent; }
      p { margin-top: 24px; font-size: 24px; line-height: 1.4; color: #b4b4ba; max-width: 520px; }
      .meta { margin-top: auto; font-size: 19px; color: #8e8e94; }
      .pop {
        width: 400px; align-self: center; border-radius: 22px; padding: 22px 24px;
        background: rgba(30, 30, 34, 0.92); border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 40px 100px -30px rgba(20, 90, 255, 0.6);
      }
      .pop h2 { font-size: 19px; font-weight: 600; margin-bottom: 16px; }
      .row { display: flex; align-items: center; gap: 14px; padding: 9px 0; }
      .badge { width: 30px; height: 30px; border-radius: 8px; flex: none; }
      .label { width: 128px; font-size: 17px; }
      .track { height: 4px; border-radius: 4px; background: #3a3a3c; margin-top: 6px; overflow: hidden; }
      .track i { display: block; height: 100%; border-radius: 4px; }
      .value { margin-left: auto; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../public/icon-256.webp" alt="" />MoniMac</div>
      <h1>See what your Mac is <span>really doing.</span></h1>
      <p>A free, open-source system monitor for your menu bar, with history and per-app usage.</p>
      <div class="meta">Free · Open source · Apple silicon · macOS 14.2+</div>
    </div>
    <div class="pop">
      <h2>MoniMac</h2>
      <div class="row"><span class="badge" style="background:#409cff"></span><div class="label">CPU<div class="track"><i style="width:32%;background:#409cff"></i></div></div><span class="value">32%</span></div>
      <div class="row"><span class="badge" style="background:#bf5af2"></span><div class="label">Memory<div class="track"><i style="width:63%;background:#bf5af2"></i></div></div><span class="value">11.4 / 18 GB</span></div>
      <div class="row"><span class="badge" style="background:#ffb340"></span><div class="label">GPU<div class="track"><i style="width:18%;background:#ffb340"></i></div></div><span class="value">18%</span></div>
      <div class="row"><span class="badge" style="background:#40c8e0"></span><div class="label">Network<div class="track"><i style="width:42%;background:#40c8e0"></i></div></div><span class="value">↓4.2 MB/s</span></div>
      <div class="row"><span class="badge" style="background:#7d7aff"></span><div class="label">Disk<div class="track"><i style="width:69%;background:#7d7aff"></i></div></div><span class="value">682 / 994 GB</span></div>
      <div class="row"><span class="badge" style="background:#30d158"></span><div class="label">Battery<div class="track"><i style="width:86%;background:#30d158"></i></div></div><span class="value">86%</span></div>
      <div class="row"><span class="badge" style="background:#ff6961"></span><div class="label">Temperature<div class="track"><i style="width:55%;background:#ff6961"></i></div></div><span class="value">58 °C</span></div>
    </div>
  </body>
</html>
